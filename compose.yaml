services:
  api:
    image: api
    build:
      context: .
      dockerfile: API/Dockerfile

  worker:
    image: worker
    build:
      context: .
      dockerfile: Worker/Dockerfile

  redis:
    image: redis:7.2
    container_name: redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: